<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1814">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Find Y Crew</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Syne+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ee; --bg2:#ede9e1; --bg3:#e4dfd5; --paper:#faf2e8;
  --ink:#1a1814; --ink2:#4a4640; --ink3:#8a8278;
  --accent:#ff4500; --acc2:#ff6a35; --green:#1a7a3c; --amber:#cc7700; --red:#c4210a;
  --border:rgba(26,24,20,.10); --border2:rgba(26,24,20,.18);
  --fd:'Syne',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fm:'Syne Mono',ui-monospace,Menlo,Consolas,monospace;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--ink);color:var(--ink);font-family:var(--fd);overflow:hidden;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hide{display:none!important}

/* ── SPLASH ───────────────────────────── */
#splash{position:fixed;inset:0;z-index:5000;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
.spl-mark{width:64px;height:64px;margin-bottom:6px;animation:fadeUp .6s ease both}
.spl-word{font-size:34px;font-weight:800;color:#fff;letter-spacing:-.5px;animation:fadeUp .6s .1s ease both}
.spl-word span{color:var(--accent)}
.spl-sub{font-family:var(--fm);font-size:11px;color:#888;letter-spacing:3px;text-transform:uppercase;animation:fadeUp .6s .2s ease both}
.spl-bar{width:120px;height:2px;background:#2a2a2a;overflow:hidden;margin-top:18px;animation:fadeUp .4s .3s ease both}
.spl-bar i{display:block;height:2px;width:0;background:var(--accent);animation:barW 1.3s .4s ease forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes barW{to{width:100%}}

/* ── FULL-SCREEN STEPS (onboarding / setup / gps) ─── */
.screen{position:fixed;inset:0;z-index:3000;background:var(--bg);display:none;flex-direction:column}
.screen.show{display:flex}
.ob-slides{flex:1;position:relative;overflow:hidden}
.ob-slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;text-align:center;transition:transform .4s cubic-bezier(.4,0,.2,1),opacity .4s}
.ob-slide.prev{transform:translateX(-100%);opacity:0;pointer-events:none}
.ob-slide.next{transform:translateX(100%);opacity:0;pointer-events:none}
.ob-ico{width:84px;height:84px;border-radius:24px;background:var(--ink);display:flex;align-items:center;justify-content:center;margin-bottom:22px}
.ob-ico svg{width:42px;height:42px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ob-title{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:10px}
.ob-body{font-size:15px;color:var(--ink2);line-height:1.7;max-width:310px}
.ob-body b{color:var(--accent)}
.ob-dots{display:flex;gap:6px;justify-content:center;padding:14px}
.ob-dot{width:6px;height:6px;border-radius:3px;background:var(--bg3);transition:all .2s}
.ob-dot.on{width:20px;background:var(--accent)}
.ob-foot{padding:10px 24px calc(26px + var(--safe-b));display:flex;gap:10px}
.btn{padding:14px 18px;border:none;border-radius:2px;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;transition:background .15s,border-color .15s}
.btn-p{background:var(--accent);color:#fff}.btn-p:hover{background:var(--acc2)}
.btn-p:disabled{opacity:.5}
.btn-g{background:transparent;border:1.5px solid var(--border2);color:var(--ink2)}
.btn-g:hover{border-color:var(--accent);color:var(--accent)}
.btn-d{background:var(--ink);color:#fff}
.flex1{flex:1}.flex2{flex:2}
.lang-fix{position:fixed;top:12px;right:12px;z-index:3100}

#setup{align-items:center;justify-content:center;padding:28px}
.card{width:100%;max-width:350px;display:flex;flex-direction:column;gap:16px}
.card-word{font-size:11px;font-weight:700;letter-spacing:5px;color:var(--ink3);text-transform:uppercase;text-align:center}
.card-title{font-size:26px;font-weight:800;letter-spacing:-.5px;text-align:center}
.lbl{font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--ink3)}
.inp{width:100%;background:#fff;border:1.5px solid var(--border2);color:var(--ink);font-size:16px;font-weight:600;padding:13px 14px;outline:none;border-radius:2px;letter-spacing:1px;text-transform:uppercase}
.inp:focus{border-color:var(--accent)}
.inp::placeholder{color:var(--ink3);text-transform:none;font-weight:400;letter-spacing:0}
.step{display:none;flex-direction:column;gap:12px}.step.on{display:flex}
.colors{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sw{aspect-ratio:1;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .15s}
.sw.on{border-color:var(--ink);transform:scale(1.12)}
.avs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.av-o{aspect-ratio:1;background:#fff;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:22px;border-radius:6px}
.av-o.on{border-color:var(--accent);background:rgba(255,69,0,.07)}
.prev{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border:1.5px solid var(--border)}
.prev .pa{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;border:2.5px solid;flex:0 0 auto}
.prev .pn{font-size:14px;font-weight:700;letter-spacing:1px}
.err{font-size:12px;color:var(--red);font-family:var(--fm);text-align:center;min-height:16px}
.ret{background:rgba(26,122,60,.07);border:1.5px solid rgba(26,122,60,.25);padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;border-radius:2px;width:100%;text-align:left;color:inherit}
.ret .pa{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}
.ret b{display:block;font-size:14px;color:var(--green)}
.ret small{font-size:11px;color:var(--ink3);font-family:var(--fm)}
.or{text-align:center;font-size:10px;color:var(--ink3);font-family:var(--fm);letter-spacing:2px}

#gps{align-items:center;justify-content:center;gap:14px;padding:32px;text-align:center}
#gps h2{font-size:20px;color:var(--accent)}
#gps p{font-size:14px;color:var(--ink2);line-height:1.7;max-width:300px}
#gps ul{text-align:left;background:#fff;border:1.5px solid var(--border);padding:12px 16px;width:100%;max-width:310px;list-style:none}
#gps li{font-size:12px;color:var(--ink2);line-height:2}
#gps li::before{content:'→ ';color:var(--ink3)}

/* ── APP SHELL ───────────────────────── */
#app{display:none;height:100dvh;flex-direction:column;background:var(--ink)}
#app.show{display:flex}
#hdr{flex:0 0 auto;background:var(--ink);padding:0 12px 0 14px;display:flex;align-items:center;gap:10px;height:50px;padding-top:env(safe-area-inset-top,0px)}
.logo{font-size:17px;font-weight:800;color:#fff;letter-spacing:-.3px;text-decoration:none;flex:1;white-space:nowrap}
.logo span{color:var(--accent)}
.pill{display:flex;align-items:center;gap:6px;font-family:var(--fm);font-size:10px;letter-spacing:1.5px;color:rgba(255,255,255,.7);text-transform:uppercase;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:#555}
.dot.live{background:#2fcf6a;box-shadow:0 0 6px #2fcf6a;animation:blink 2s infinite}
.dot.demo{background:var(--accent)}
.dot.err{background:var(--red)}
@keyframes blink{50%{opacity:.35}}
.hbtn{background:transparent;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.85);font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:7px 10px;border-radius:2px;display:flex;align-items:center;gap:6px}
.hbtn:hover{border-color:var(--accent);color:#fff}
.hbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
select.lang{background:transparent;border:1px solid rgba(255,255,255,.2);color:#fff;font-size:15px;padding:6px 4px;border-radius:2px;appearance:none;-webkit-appearance:none;text-align:center;width:74px;cursor:pointer}
select.lang option{color:#000}
.lang-fix select.lang{background:var(--ink)}

#body{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;min-width:0;min-height:0;background:var(--paper);overflow:hidden}

/* ── MAP VIEWER ──────────────────────── */
#vp{position:absolute;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;background:var(--paper);cursor:grab}
#vp.pick{cursor:crosshair}
#vp:active{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;--inv:1;--mv:1s}
#world img{display:block;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none;user-select:none}
#heat{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;opacity:0;transition:opacity .4s}
#mapimg{transition:filter .4s}
#vp.org{background:#f2f2f2}
#world.org #mapimg{filter:grayscale(.92) brightness(1.07) contrast(.9)}
#heat.on{opacity:1}
#mks{position:absolute;left:0;top:0;width:0;height:0}
.mk{position:absolute;left:0;top:0;width:0;height:0;will-change:transform;transition:transform var(--mv) linear;z-index:10}
.mk.me{z-index:30}.mk.meet{z-index:20}
.mk-in{position:absolute;left:0;top:0;width:0;height:0;transform:scale(var(--inv));transform-origin:0 0}
.mk-av{position:absolute;left:-18px;top:-18px;width:36px;height:36px;border-radius:50%;background:#fff;border:3px solid var(--c,#333);display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.35);cursor:pointer}
.mk-nm{position:absolute;left:0;top:22px;transform:translateX(-50%);font-family:var(--fm);font-size:10px;font-weight:700;color:#fff;background:var(--c,#333);padding:2px 6px;border-radius:3px;white-space:nowrap;letter-spacing:.5px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.mk-st{position:absolute;left:0;bottom:24px;transform:translateX(-50%);font-size:11px;font-weight:600;color:#fff;background:rgba(26,24,20,.9);padding:3px 8px;border-radius:9px;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis;display:none}
.mk-st.on{display:block}
.mk.stale .mk-av,.mk.stale .mk-nm{filter:grayscale(1);opacity:.7}
.mk.me .mk-av::after{content:'';position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--c);opacity:.5;animation:ring 2s ease-out infinite}
.mk.me.hidden .mk-av{border-style:dashed;opacity:.65}
.mk.sel .mk-av{transform:scale(1.18)}
@keyframes ring{0%{transform:scale(.7);opacity:.7}100%{transform:scale(1.5);opacity:0}}
.mk.meet .mk-in{filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.flag-pole{position:absolute;left:-1px;top:-38px;width:2px;height:38px;background:var(--c)}
.flag{position:absolute;left:1px;top:-40px;background:var(--c);color:#fff;font-size:11px;font-weight:700;padding:3px 8px 3px 7px;border-radius:0 3px 3px 0;white-space:nowrap;letter-spacing:.3px}
.flag-base{position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--c)}
.ripple{position:absolute;width:0;height:0;pointer-events:none;z-index:5}
.ripple::after{content:'';position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;border:3px solid var(--accent);transform:scale(var(--inv));animation:rip .7s ease-out forwards}
@keyframes rip{from{opacity:.9;margin:0}to{opacity:0;margin:0;transform:scale(calc(var(--inv)*2.4))}}

#loading{position:absolute;inset:0;z-index:40;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .4s}
#loading.out{opacity:0;pointer-events:none}
#loading i{width:36px;height:36px;border-radius:50%;border:3px solid var(--bg3);border-top-color:var(--accent);animation:spin .8s linear infinite}
#loading span{font-family:var(--fm);font-size:11px;letter-spacing:3px;color:var(--ink3);text-transform:uppercase}
#loading button{margin-top:6px}
@keyframes spin{to{transform:rotate(360deg)}}

.ctl{position:absolute;right:10px;bottom:10px;z-index:35;display:flex;flex-direction:column;gap:6px}
.cb{width:40px;height:40px;background:#fff;border:1.5px solid var(--border2);color:var(--ink);font-size:20px;font-weight:600;display:flex;align-items:center;justify-content:center;border-radius:3px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.cb:active{background:var(--bg2)}
.cb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cb.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.chip{position:absolute;left:10px;bottom:10px;z-index:35;display:flex;flex-direction:column;gap:6px;max-width:calc(100% - 66px)}
.banner{background:var(--ink);color:#fff;font-size:12px;line-height:1.5;padding:9px 12px;border-left:3px solid var(--accent);border-radius:2px;box-shadow:0 2px 8px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center}
.banner small{font-family:var(--fm);font-size:10px;letter-spacing:1px;color:rgba(255,255,255,.55);display:block}
.banner button{background:var(--accent);color:#fff;border:none;font-size:10px;font-weight:700;letter-spacing:1.5px;padding:7px 10px;text-transform:uppercase;border-radius:2px;white-space:nowrap}
.banner .x{background:transparent;color:rgba(255,255,255,.5);font-size:15px;padding:2px 4px}
.legend{position:absolute;left:10px;top:10px;z-index:35;background:rgba(255,255,255,.94);border:1.5px solid var(--border2);padding:8px 10px;font-size:11px;line-height:1.5;border-radius:3px;max-width:62%}
.legend .bar{height:7px;border-radius:4px;background:linear-gradient(90deg,#ffd9a8,#ff9b4d,#ff4500,#b81d00);margin:5px 0 3px}
.legend .row{display:flex;justify-content:space-between;font-family:var(--fm);font-size:9px;color:var(--ink3);letter-spacing:1px}

#toasts{position:fixed;top:58px;left:50%;transform:translateX(-50%);z-index:4500;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,340px)}
.toast{background:var(--ink);color:#fff;font-size:12px;padding:9px 13px;border-left:3px solid var(--accent);border-radius:2px;width:100%;box-shadow:0 4px 14px rgba(0,0,0,.3);animation:tin .25s ease both}
.toast.g{border-left-color:#2fcf6a}.toast.a{border-left-color:var(--amber)}.toast.r{border-left-color:var(--red)}
.toast b{display:block;font-size:12px}.toast span{color:rgba(255,255,255,.65);font-size:11px}
.toast.out{animation:tout .25s ease forwards}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
@keyframes tout{to{opacity:0;transform:translateY(-6px)}}

/* ── SIDE PANEL ──────────────────────── */
#side{flex:0 0 340px;background:#fff;border-left:1.5px solid var(--border);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;border-bottom:1.5px solid var(--border);flex:0 0 auto;background:#fff}
.tab{flex:1;padding:11px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;border-bottom:2.5px solid transparent;color:var(--ink3);font-size:9px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase}
.tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
#panel{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;min-height:0;-webkit-overflow-scrolling:touch}
#panel::-webkit-scrollbar{width:3px}#panel::-webkit-scrollbar-thumb{background:var(--bg3)}
.sl{font-size:9px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--ink3)}
.box{background:var(--bg);border:1.5px solid var(--border);padding:12px;border-radius:2px}
.me-box{text-align:center}
.me-av{width:46px;height:46px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:22px;border:3px solid}
.me-nm{font-size:15px;font-weight:800;letter-spacing:1px}
.me-code{font-family:var(--fm);font-size:22px;letter-spacing:6px;margin:4px 0 2px}
.hint{font-size:11px;color:var(--ink3);line-height:1.5}
.row2{display:flex;gap:8px;margin-top:10px}
.sbtn{flex:1;padding:9px 6px;background:transparent;border:1.5px solid var(--border2);color:var(--ink2);font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;border-radius:2px}
.sbtn:hover{border-color:var(--accent);color:var(--accent)}
.sbtn.p{background:var(--accent);border-color:var(--accent);color:#fff}
.sbtn.p:hover{background:var(--acc2);color:#fff}
.sbtn:disabled{opacity:.5}
.fc{display:flex;align-items:center;gap:10px;padding:9px 10px;background:var(--bg);border:1.5px solid var(--border);cursor:pointer;border-radius:2px}
.fc.sel{border-color:var(--accent);background:#fff}
.fc .fa{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;border:2.5px solid;flex:0 0 auto;background:#fff}
.fc .fi{flex:1;min-width:0}
.fc .fn{font-size:13px;font-weight:700;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc .fz{font-family:var(--fm);font-size:10px;color:var(--ink3);margin-top:1px}
.fc .fz.live{color:var(--green)}
.fc .fs{font-size:11px;color:var(--amber);margin-top:2px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc .fx{background:none;border:none;color:var(--ink3);font-size:16px;padding:4px 6px}
.fc .fx:hover{color:var(--red)}
.empty{font-size:12px;color:var(--ink3);line-height:1.7;text-align:center;padding:12px 4px}
.addf{display:flex;gap:8px}
.addf .inp{font-family:var(--fm);letter-spacing:4px;font-size:15px;padding:10px;text-align:center}
.emo{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.em{font-size:19px;padding:5px 7px;background:#fff;border:1.5px solid var(--border);border-radius:4px}
.em.on{border-color:var(--amber);background:rgba(204,119,0,.08)}
.txt{width:100%;background:#fff;border:1.5px solid var(--border);padding:10px;font-size:14px;outline:none;border-radius:2px;margin-bottom:8px}
.txt:focus{border-color:var(--amber)}
.chipst{display:flex;align-items:center;gap:8px;padding:9px 11px;background:rgba(204,119,0,.07);border:1.5px solid rgba(204,119,0,.25);border-radius:2px;font-size:13px;color:var(--amber)}
.chipst span{flex:1}.chipst button{background:none;border:none;color:var(--ink3);font-size:15px}
.zc{display:flex;align-items:center;gap:10px;padding:9px 10px;background:var(--bg);border:1.5px solid var(--border);cursor:pointer;border-radius:2px;width:100%;text-align:left;color:inherit}
.zc:hover{background:#fff;border-color:var(--border2)}
.zc .zi{font-size:18px;width:26px;text-align:center}
.zc b{font-size:12px;letter-spacing:.5px;display:block}
.zc small{font-size:11px;color:var(--ink3)}
.prow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.prow:last-child{border-bottom:none}
.prow div{flex:1}.prow b{font-size:13px;display:block}.prow small{font-size:11px;color:var(--ink3);line-height:1.4;display:block;margin-top:1px}
.tg{width:44px;height:26px;background:var(--bg3);border-radius:13px;position:relative;border:none;flex:0 0 auto;transition:background .2s}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.tg.on{background:var(--green)}.tg.on::after{transform:translateX(18px)}
.note{font-size:11px;color:var(--ink2);line-height:1.6;background:var(--bg);border:1.5px dashed var(--border2);padding:10px 12px;border-radius:2px}
.danger{color:var(--red);border-color:rgba(196,33,10,.35)}

function xy2ll(x,y){return{lat:MAP.center[0]-(y-MAP.h/2)/(MDEG*PXM), lng:MAP.center[1]+(x-MAP.w/2)/(COSLAT*MDEG*PXM)};}
const inside=(x,y,m=60)=>x>=-m&&x<=MAP.w+m&&y>=-m&&y<=MAP.h+m;

/* ═══════════════ MAP VIEWER (own pan/zoom, no tiles, no libraries) ═══════════════ */
const V={s:1,tx:0,ty:0,minS:.3,maxS:2.2,vw:0,vh:0,ptrs:new Map(),last:null,anim:0,ready:false};
const vp=$('#vp'), world=$('#world');
world.style.width=MAP.w+'px'; world.style.height=MAP.h+'px';
function vMeasure(){const r=vp.getBoundingClientRect();V.vw=r.width;V.vh=r.height;V.minS=Math.min(V.vw/MAP.w,V.vh/MAP.h)||.3;V.maxS=Math.max(2.2,V.minS*3);}
function clampT(tx,ty,s){const W=MAP.w*s,H=MAP.h*s;return{tx:W<=V.vw?(V.vw-W)/2:clamp(tx,V.vw-W,0),ty:H<=V.vh?(V.vh-H)/2:clamp(ty,V.vh-H,0)};}
function vApply(){const c=clampT(V.tx,V.ty,V.s);V.tx=c.tx;V.ty=c.ty;world.style.transform=`translate(${V.tx.toFixed(1)}px,${V.ty.toFixed(1)}px) scale(${V.s.toFixed(4)})`;world.style.setProperty('--inv',(1/V.s).toFixed(4));}
function zoomAt(f,cx,cy){const ns=clamp(V.s*f,V.minS,V.maxS),wx=(cx-V.tx)/V.s,wy=(cy-V.ty)/V.s;V.s=ns;V.tx=cx-wx*ns;V.ty=cy-wy*ns;vApply();}
function toWorld(cx,cy){const r=vp.getBoundingClientRect();return{x:(cx-r.left-V.tx)/V.s,y:(cy-r.top-V.ty)/V.s};}
function stopAnim(){if(V.anim){cancelAnimationFrame(V.anim);V.anim=0;}}
function flyTo(x,y,s,ms=520){
  stopAnim(); const ts=clamp(s??V.s,V.minS,V.maxS), tgt=clampT(V.vw/2-x*ts,V.vh/2-y*ts,ts);
  const s0=V.s,x0=V.tx,y0=V.ty,t0=performance.now();
  const step=now=>{const k=Math.min(1,(now-t0)/ms),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    V.s=s0+(ts-s0)*e;V.tx=x0+(tgt.tx-x0)*e;V.ty=y0+(tgt.ty-y0)*e;vApply();V.anim=k<1?requestAnimationFrame(step):0;};
  V.anim=requestAnimationFrame(step);
}
function fitAll(){vMeasure();flyTo(MAP.w/2,MAP.h/2,V.minS);}
function startView(x,y){ // comfortable first view: closer than "whole map" on tall phone screens
  vMeasure(); const cover=Math.max(V.vw/MAP.w,V.vh/MAP.h); V.s=clamp(Math.min(cover,V.minS*(V.vw<700?2.3:1.0)),V.minS,V.maxS);
  const c=clampT(V.vw/2-x*V.s,V.vh/2-y*V.s,V.s);V.tx=c.tx;V.ty=c.ty;vApply();
}
vp.addEventListener('pointerdown',e=>{
  if(e.button>0) return; try{vp.setPointerCapture(e.pointerId);}catch(_){}
  stopAnim(); V.ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,t:performance.now(),target:e.target,moved:false,multi:false});
  if(V.ptrs.size>=2){V.ptrs.forEach(p=>p.multi=true);V.last=null;}
});
vp.addEventListener('pointermove',e=>{
  const p=V.ptrs.get(e.pointerId); if(!p) return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y; p.x=e.clientX;p.y=e.clientY;
  if(Math.hypot(e.clientX-p.sx,e.clientY-p.sy)>7) p.moved=true;
  if(V.ptrs.size===1){ if(p.moved){V.tx+=dx;V.ty+=dy;vApply();} }
  else if(V.ptrs.size>=2){
    const [a,b]=[...V.ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2,r=vp.getBoundingClientRect();
    if(V.last&&V.last.d>0){V.tx+=mx-V.last.mx;V.ty+=my-V.last.my;zoomAt(d/V.last.d,mx-r.left,my-r.top);}
    V.last={d,mx,my};
  }
});
function pEnd(e){
  const p=V.ptrs.get(e.pointerId); if(!p) return; V.ptrs.delete(e.pointerId); V.last=null;
  if(e.type==='pointerup'&&!p.moved&&!p.multi&&performance.now()-p.t<600){
    const mk=p.target.closest&&p.target.closest('.mk'); 
    if(mk&&mk.dataset.id) onMarkerTap(mk.dataset.id); else onMapTap(toWorld(e.clientX,e.clientY));
  }
}
vp.addEventListener('pointerup',pEnd); vp.addEventListener('pointercancel',pEnd);
vp.addEventListener('wheel',e=>{e.preventDefault();const r=vp.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*(e.ctrlKey?.01:.0016)),e.clientX-r.left,e.clientY-r.top);},{passive:false});
vp.addEventListener('dblclick',e=>{const r=vp.getBoundingClientRect();zoomAt(1.8,e.clientX-r.left,e.clientY-r.top);});
new ResizeObserver(()=>{const wasMin=V.ready&&Math.abs(V.s-V.minS)<.001;vMeasure();if(wasMin)V.s=V.minS;V.s=clamp(V.s,V.minS,V.maxS);vApply();}).observe(vp);

function flag(id,o){

/* ═══════════════ LIVE (Supabase) ═══════════════ */
const NET={fails:0,timer:0,okOnce:false,watch:0};
async function sb(path,o={}){
  const r=await fetch(SB_URL+'/rest/v1/'+path,{method:o.method||'GET',keepalive:!!o.keepalive,
    headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json',...(o.method==='POST'?{Prefer:'resolution=merge-duplicates,return=minimal'}:{})},
    body:o.body?JSON.stringify(o.body):undefined});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return (o.method&&o.method!=='GET')?null:r.json();
}
function myRow(){
  const p=S.pos; let lat=p.lat,lng=p.lng;
  if(!S.exact){lat=Math.round(lat*1000)/1000;lng=Math.round(lng*1000)/1000;}   // ≈100 m
  const meet=S.meet?`||MEET:${S.meet.lat.toFixed(6)}:${S.meet.lng.toFixed(6)}`:'';
  return{id:S.code,code:S.code,name:S.name,color:S.color,avatar:S.avatar,x:lat,y:lng,status:myStatus()+meet,status_expiry:S.statusExp,updated_at:Date.now()};
}
function parseRow(r){
  const lat=Number(r.x),lng=Number(r.y); if(!Number.isFinite(lat)||!Number.isFinite(lng)) return null;
  const raw=String(r.status||''),i=raw.indexOf('||MEET:'); let txt=raw,meet=null;
  if(i>-1){txt=raw.slice(0,i);const mp=raw.slice(i+7).split(':').map(Number);if(mp.length>=2&&mp.every(Number.isFinite))meet=ll2xy(mp[0],mp[1]);}
  if((Number(r.status_expiry)||0)<=Date.now()) txt='';
  const p=ll2xy(lat,lng);
  return{code:String(r.code),name:String(r.name||'?').slice(0,14),color:isColor(r.color)?r.color:'#888888',avatar:okAvatar(r.avatar),x:p.x,y:p.y,seen:Number(r.updated_at)||0,status:txt.slice(0,60),meet};
}
async function pullFriends(){
  const codes=S.friends.map(f=>f.code).filter(okCode); if(!codes.length) return;
  // Only the rows of people in MY crew are requested (never the whole table).
  const rows=await sb('positions?select=*&code=in.('+codes.join(',')+')'); const now=Date.now(),seen=new Set();
  for(const r of rows){const f=parseRow(r); if(!f||!codes.includes(f.code)||now-f.seen>HIDE_MS) continue; seen.add(f.code); F[f.code]=f;}
  for(const c of codes) if(!seen.has(c)) delete F[c];
  renderFriendsWorld(); renderFriendList();
}
async function liveTick(){
  clearTimeout(NET.timer);
  if(!document.hidden){
    const jobs=[]; if(S.pos&&S.visible) jobs.push(sb('positions',{method:'POST',body:[myRow()]})); jobs.push(pullFriends());
    const res=await Promise.allSettled(jobs);
    if(res.every(r=>r.status==='fulfilled')){
      NET.fails=0; setConn('live'); if(!NET.okOnce){NET.okOnce=true;toast(t('conn_ok'),t('conn_ok_b'),'g',2500);}
    } else { NET.fails++; if(NET.fails>=2){ if(NET.okOnce||NET.fails===2) toast(t('conn_lost'),t('conn_lost_b'),'a',2500); setConn('err'); } }
  }
  NET.timer=setTimeout(liveTick,LIVE_MS);
}
function removeRow(){
  if(DEMO||!S.code||!S.started) return;
  try{fetch(SB_URL+'/rest/v1/positions?id=eq.'+encodeURIComponent(S.code),{method:'DELETE',keepalive:true,headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});}catch(e){}
}
addEventListener('pagehide',removeRow);
addEventListener('pageshow',e=>{if(e.persisted&&S.started&&!DEMO) liveTick();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.started&&!DEMO) liveTick();});
async function addFriend(raw){
  const code=String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(!okCode(code)) return 'err_code'; if(code===S.code) return 'err_self'; if(S.friends.some(f=>f.code===code)) return 'err_dup';
  try{
    const rows=await sb('positions?select=*&code=eq.'+code); const f=rows[0]&&parseRow(rows[0]); if(!f) return 'err_nocode';
    S.friends.push({code,name:f.name,color:f.color,avatar:f.avatar}); F[code]=f; saveProfile();
    toast(t('added',{n:f.name}),'','g'); renderFriendsWorld(); renderFriendList(); return null;
  }catch(e){return 'err_net';}
}
function startGPS(){
  if(!navigator.geolocation){toast(t('gps_unsup'),'','a');return;}
  NET.watch=navigator.geolocation.watchPosition(onPos,onGPSErr,{enableHighAccuracy:true,maximumAge:2000,timeout:20000});
}
function onPos(p){
  const first=!S.pos, xy=ll2xy(p.coords.latitude,p.coords.longitude);
  S.pos={lat:p.coords.latitude,lng:p.coords.longitude,x:xy.x,y:xy.y,acc:p.coords.accuracy,inside:inside(xy.x,xy.y,120)};
  renderMe();
  if(first){ if(S.pos.inside) flyTo(xy.x,xy.y,Math.max(V.s,1.1),700); else showOutside(); liveTick(); }
}
function onGPSErr(e){
  if(e.code===1){ $('#gps').classList.add('show'); }

}
function showOutside(){
  const c=$('#chip'); if($('#b-out',c)) return;

  c.appendChild(b);

const G={nodes:[],adj:[],key:new Map()};
function gNode(x,y){const k=Math.round(x)+','+Math.round(y);let i=G.key.get(k);if(i===undefined){i=G.nodes.length;G.nodes.push([x,y]);G.adj.push([]);G.key.set(k,i);}return i;}

class Walker{

  moveTo(tx,ty,dt){const dx=tx-this.x,dy=ty-this.y,d=Math.hypot(dx,dy),s=this.speed*dt;if(d<=s){this.x=tx;this.y=ty;return true;}this.x+=dx/d*s;this.y+=dy/d*s;return false;}

    if(!this.tp)this.go(this.pick?this.pick():pickPoi(demo.hour));
    if(this.arrived){ if(this.moveTo(this.tp.x+this.off[0],this.tp.y+this.off[1],dt)){this.at=this.tp.id;this.wait=this.role==='crowd'?rnd(15,70):rnd(8,20);this.tp=null;} return; }
    if(this.node===this.tp.node){this.arrived=true;return;}
    if(this.next===null){const nb=G.adj[this.node];let best=nb[0],bd=1e9;for(const n of nb){const d=this.dist[n]+Math.random()*.4;if(d<bd){bd=d;best=n;}}this.next=best;}

  }
}

const CELL=28, CW=Math.ceil(MAP.w/CELL), CH=Math.ceil(MAP.h/CELL);
function crowdStats(){
  const grid=new Uint16Array(CW*CH); for(const w of demo.crowd){grid[Math.floor(w.y/CELL)*CW+Math.floor(w.x/CELL)]++;}
  const zones=POIS.map(p=>({id:p.id,n:0})); for(const w of demo.crowd){let bi=-1,bd=70*70;POIS.forEach((p,i)=>{const d=(p.x-w.x)**2+(p.y-w.y)**2;if(d<bd){bd=d;bi=i;}});if(bi>-1)zones[bi].n++;}
  zones.sort((a,b)=>b.n-a.n); return{grid,zones};
}
let heatMax=1;
function updateHeat(){
  if(!orgMode()) return;
  const{grid,zones}=crowdStats(),c=$('#heat'),g=c.getContext('2d'),k=c.width/MAP.w; g.clearRect(0,0,c.width,c.height);
  let mx=1; for(const v of grid) if(v>=K_MIN&&v>mx) mx=v; heatMax=mx;
  for(let y=0;y<CH;y++)for(let x=0;x<CW;x++){
    const v=grid[y*CW+x]; if(v<K_MIN) continue;                       // k-anonymity threshold
    const tt=Math.min(1,(v-K_MIN+1)/Math.max(1,mx-K_MIN+1)), cx=(x+.5)*CELL*k, cy=(y+.5)*CELL*k, r=CELL*2.1*k;
    const col=tt<.34?'255,214,64':tt<.67?'255,96,48':'190,20,90', gr=g.createRadialGradient(cx,cy,0,cx,cy,r);
    gr.addColorStop(0,`rgba(${col},${.38+.5*tt})`); gr.addColorStop(1,`rgba(${col},0)`); g.fillStyle=gr; g.beginPath(); g.arc(cx,cy,r,0,6.3); g.fill();
  }
  orgStats(zones);
}

}
function assign(k,quiet){
  const role=TTYPES[k.type].role, w=nearestFree(role,k.zone);
  if(!w){ toast(t('t_nofree',{r:t('r_'+role)}),'','a'); return false; }
  const m=hopsM(demo.dist[k.zone][w.node]); k.w=w; k.state='enroute'; k.m=m; k.eta=etaMin(m); w.st.task=k;
  w.hold=false; w.wait=0; w.at=null; w.go(POI_BY[k.zone]);
  if(!quiet) toast(t('t_assigned',{n:w.st.id}),t('tt_'+k.type)+' · '+zName(k.zone)+' · '+etaTxt(m),'g',3200);
  orgDraw(); return true;
}
function cancelTask(k){ if(k.w){k.w.st.task=null;k.w.hold=false;k.w.wait=rnd(5,15);} ORG.tasks=ORG.tasks.filter(x=>x!==k); orgDraw(); }
function orgTick(){
  for(const w of ORG.staff){
    w.step(1); const k=w.st.task; if(!k) continue;
    if(k.state==='enroute'&&w.at===k.zone){k.state='working';k.t1=demo.tick;w.hold=true;}
    else if(k.state==='working'&&demo.tick-k.t1>=8){
      k.state='done'; k.tDone=demo.tick; w.st.task=null; w.hold=false; w.wait=rnd(10,25);
      if(k.type==='crowd') ORG.handled[k.zone]=demo.tick;
      toast(t('t_completed',{t:t('tt_'+k.type),z:zName(k.zone)}),t('t_completed_b',{n:w.st.id}),'g',2800);
    }
  }
  if(demo.tick===14){const k=newTask('med','food','urgent','inc_med');toast(t('inc_new'),t('inc_med')+' · '+zName('food'),'r',4200);}
  if(demo.tick===70){newTask('lost','bridge','urgent','inc_lost');toast(t('inc_new'),t('inc_lost'),'r',4200);}
  orgDraw();
}
/* ── map layer: staff + incidents ── */
function orgDraw(){
  for(const w of ORG.staff){
    const id='st_'+w.st.id, r=ROLES[w.st.role];
    if(!ORG.layers.staff){dropMk(id);continue;}
    let m=Mk[id]; if(!m){m=Mk[id]={first:true,el:mkMake(id,'staff','<div class="mk-in"><div class="sf-b"></div><div class="mk-nm"></div></div>')};}
    m.el.style.setProperty('--c',r.c); $('.sf-b',m.el).textContent=r.icon; $('.mk-nm',m.el).textContent=w.st.id;
    m.el.classList.toggle('busy',!!w.st.task); m.el.classList.toggle('sel',ORG.hl===id); mkPlace(m,w.x,w.y);
  }
  const live=new Set();
  for(const k of ORG.tasks){ if(k.state==='done'||!ORG.layers.tasks) continue; const id='tk_'+k.id; live.add(id); const z=POI_BY[k.zone];
    let m=Mk[id]; if(!m){m=Mk[id]={first:true,el:mkMake(id,'task','<div class="mk-in"><div class="tk-p"></div></div>')};}
    m.el.dataset.st=k.state; $('.tk-p',m.el).textContent=TTYPES[k.type].icon; m.el.classList.toggle('sel',ORG.hl===id);
    const n=ORG.tasks.filter(x=>x.zone===k.zone&&x.state!=='done'),i=n.indexOf(k); mkPlace(m,z.x+(i*30)-((n.length-1)*15),z.y-30);
  }
  Object.keys(Mk).forEach(id=>{if(id.startsWith('tk_')&&!live.has(id))dropMk(id);});
  orgRefresh();
}
/* ── panels ── */
function zoneRows(){ return ORG.zones.map(z=>({...z,cap:CAP[z.id],pct:Math.round(z.n/CAP[z.id]*100)})).sort((a,b)=>b.pct-a.pct); }
const lvl=p=>p>=90?'r':p>=70?'a':'g';
function activeAlerts(){
  return zoneRows().filter(z=>ORG.on[z.id]&&z.n>=K_MIN&&!(ORG.handled[z.id]&&demo.tick-ORG.handled[z.id]<60));
}
function orgStats(zones){ // light smoothing so percentages don't jump every tick
  const prev=Object.fromEntries((ORG.zones||[]).map(z=>[z.id,z.n]));
  ORG.zones=zones.map(z=>({id:z.id,n:prev[z.id]===undefined?z.n:Math.round(prev[z.id]*.6+z.n*.4)}));
  for(const z of zoneRows()){ if(z.pct>=90) ORG.on[z.id]=1; else if(z.pct<85) ORG.on[z.id]=0; }   // hysteresis
  for(const z of activeAlerts()){ if(!ORG.warned[z.id]){ORG.warned[z.id]=1; if(demo.tick-(ORG.lastWarn||-99)>=12){ORG.lastWarn=demo.tick;toast('⚠ '+t('o_alert',{z:zName(z.id),p:z.pct}),t('o_alert_sub'),'r',4200);}} }
  for(const z of zoneRows()) if(z.pct<80) ORG.warned[z.id]=0;
  orgRefresh();
}
function orgRefresh(){
  if(!orgMode()||!S.started) return; const k=ORG.tab;
  if(k==='live'){
    const rows=zoneRows(),top=rows[0],open=ORG.tasks.filter(x=>x.state!=='done'),done=ORG.tasks.filter(x=>x.eta);
    const avg=done.length?Math.round(done.reduce((s,x)=>s+x.eta,0)/done.length):0;
    setH($('#o-kpi'),`<div class="kpi"><b>${demo.crowd.length}</b><small>${esc(t('o_now'))}</small></div>
      <div class="kpi ${top?lvl(top.pct):''}"><b>${top?top.pct+'%':'—'}</b><small>${top?esc(zName(top.id)):esc(t('o_busiest'))}</small></div>
      <div class="kpi ${open.length?'r':''}"><b>${open.length}</b><small>${esc(t('o_open'))}</small></div>
      <div class="kpi"><b>${avg?avg+' min':'—'}</b><small>${esc(t('o_resp'))}</small></div>`);
    const al=activeAlerts();
    setH($('#o-alerts'),al.length?al.map(z=>{const onway=ORG.tasks.some(x=>x.type==='crowd'&&x.zone===z.id&&x.state!=='done');
      return `<div class="alert"><div class="al-t">⚠ ${esc(t('o_alert',{z:zName(z.id),p:z.pct}))}</div><div class="al-s">${esc(t('o_alert_sub'))}</div>
      <div class="row2">${onway?`<span class="al-ok">✓ ${esc(t('o_on_way'))}</span>`:`<button class="sbtn p" data-act="o-sec" data-z="${z.id}">${esc(t('o_send_sec'))}</button>`}<button class="sbtn" data-act="o-notify" data-z="${z.id}">${esc(t('o_notify'))}</button></div></div>`;}).join('')
      :`<div class="okline">✓ ${esc(t('o_ok'))}</div>`);
    setH($('#o-cap'),rows.map(z=>{const low=z.n<K_MIN;
      return `<button class="cz" data-act="zone" data-id="${z.id}"><span class="cz-n">${POI_BY[z.id].icon} ${esc(zName(z.id))}</span><span class="cz-b"><i class="${lvl(z.pct)}" style="width:${low?0:Math.min(100,z.pct)}%"></i></span><span class="cz-v">${low?'<'+K_MIN:z.pct+'%'}</span></button>`;}).join(''));
  } else if(k==='tasks'){
    const open=ORG.tasks.filter(x=>x.state!=='done'),done=ORG.tasks.filter(x=>x.state==='done');
    setH($('#t-list'),open.length?open.map(taskCard).join(''):`<div class="empty">${esc(t('t_none'))}</div>`);
    setH($('#t-done'),done.length?`<div class="sl">${esc(t('t_done_h',{n:done.length}))}</div>`+done.slice(0,6).map(x=>`<div class="tdone">${TTYPES[x.type].icon} ${esc(t('tt_'+x.type))} · ${esc(zName(x.zone))}<small>${esc(x.w?x.w.st.id:'')} · ${esc(t('t_took',{m:x.eta}))}</small></div>`).join(''):'');
  } else if(k==='team'){
    const by={}; for(const w of ORG.staff){(by[w.st.role]=by[w.st.role]||[]).push(w);}
    setH($('#tm-sum'),Object.keys(ROLES).map(r=>{const a=by[r]||[],f=a.filter(w=>!w.st.task).length;
      return `<div class="rsum" style="--c:${ROLES[r].c}"><span class="rb">${ROLES[r].icon}</span><span class="rs-i"><b>${esc(t('r_'+r))}</b><small>${esc(t('tm_free',{n:f}))} / ${a.length}</small></span></div>`;}).join(''));
    setH($('#tm-list'),ORG.staff.map(w=>{const s=staffState(w),k=w.st.task,z=k?k.zone:(w.at||nearZone(w));
      const lab=s==='free'?t('tm_s_free',{z:zName(z)}):s==='enroute'?t('tm_s_enroute',{z:zName(z)})+' · '+etaTxt(hopsM(demo.dist[z][w.node])):t('tm_s_working',{z:zName(z)});
      return `<button class="sc${ORG.hl==='st_'+w.st.id?' sel':''}" data-act="o-staff" data-id="${w.st.id}" style="--c:${ROLES[w.st.role].c}"><span class="rb">${ROLES[w.st.role].icon}</span><span class="sc-i"><b>${esc(w.st.id)} <em>${esc(t('r_'+w.st.role))}</em></b><small class="${s}">${esc(lab)}</small></span></button>`;}).join(''));
  } else if(k==='msg'){
    setH($('#m-hist'),ORG.msgs.length?ORG.msgs.map(m=>`<div class="mh1"><div>${esc(m.text)}</div><small>${esc(m.to)} · ${esc(t('m_reach',{n:m.n}))} · ${esc(m.at)}</small></div>`).join(''):`<div class="empty">${esc(t('m_none'))}</div>`);
  }
}
function nearZone(w){let b='main',bd=1e9;for(const p of POIS){const d=(p.x-w.x)**2+(p.y-w.y)**2;if(d<bd){bd=d;b=p.id;}}return b;}
function taskCard(k){
  const w=k.w, st=k.state, rem=w?hopsM(demo.dist[k.zone][w.node]):0;
  const who=w?`<span class="tw" style="--c:${ROLES[w.st.role].c}">${ROLES[w.st.role].icon}</span><b>${esc(w.st.id)}</b>${st==='enroute'?' · '+esc(etaTxt(rem)):''}`:'';
  return `<div class="tc ${st}${k.prio==='urgent'?' urg':''}${ORG.hl==='tk_'+k.id?' sel':''}" data-act="o-task" data-id="${k.id}">
    <div class="tc-h"><span class="tc-i">${TTYPES[k.type].icon}</span><span class="tc-t"><b>${esc(t('tt_'+k.type))}</b><small>${POI_BY[k.zone].icon} ${esc(zName(k.zone))}${k.src?' · '+esc(t(k.src)):''}</small></span><span class="tc-s">${esc(t('ts_'+st))}</span></div>
    <div class="tc-f">${st==='open'?`<button class="sbtn p" data-act="o-assign" data-id="${k.id}">${esc(t('t_assign'))}</button>`:`<span class="tc-w">${who}</span>`}<button class="sbtn ghost" data-act="o-cancel" data-id="${k.id}">${esc(t('t_cancel'))}</button></div></div>`;
}
function orgPanel(k){
  const p=$('#panel'); let h='';
  if(k==='live'){
    h=`<div class="kpis" id="o-kpi"></div>
      <div class="sl">${esc(t('o_alerts'))}</div><div id="o-alerts" class="alerts"></div>
      <div class="sl">${esc(t('o_time'))}</div><div class="sim"><button class="sbtn" style="flex:0 0 112px" data-act="play" id="o-play">${esc(t(demo.play?'org_pause':'org_play'))}</button><input type="range" id="o-hour" min="17" max="25" step="0.5" value="${demo.hour}"><output id="o-out">${fmtHour(demo.hour)}</output></div>
      <div class="sl">${esc(t('o_cap_h'))}</div><div class="caps" id="o-cap"></div><div class="hint">${esc(t('o_cap_hint'))}</div>
      <div class="note">${esc(t('o_priv',{k:K_MIN}))}</div>`;
  } else if(k==='tasks'){
    const f=ORG.form;
    h=`<div class="box tf"><div class="sl">${esc(t('t_new'))}</div>
      <div class="lbl2">${esc(t('t_type'))}</div><div class="ttypes">${Object.keys(TTYPES).map(x=>`<button class="tt${f.type===x?' on':''}" data-act="f-type" data-v="${x}"><span>${TTYPES[x].icon}</span>${esc(t('tt_'+x))}</button>`).join('')}</div>
      <div class="lbl2">${esc(t('t_zone'))}</div><div class="frow"><select class="sel" id="f-zone">${POIS.map(z=>`<option value="${z.id}"${z.id===f.zone?' selected':''}>${z.icon} ${esc(zName(z.id))}</option>`).join('')}</select><button class="sbtn${ORG.pick?' p':''}" style="flex:0 0 84px" data-act="f-pick">${esc(t('t_onmap'))}</button></div>
      <div class="lbl2">${esc(t('t_prio'))}</div><div class="seg"><button class="${f.prio==='normal'?'on':''}" data-act="f-prio" data-v="normal">${esc(t('t_normal'))}</button><button class="${f.prio==='urgent'?'on u':''}" data-act="f-prio" data-v="urgent">${esc(t('t_urgent'))}</button></div>
      <button class="btn btn-p wide" data-act="f-go">${esc(t('t_create_assign'))}</button><button class="lnk" data-act="f-go0">${esc(t('t_create'))}</button></div>
      <div class="sl">${esc(t('t_active'))}</div><div id="t-list" class="tlist"></div><div id="t-done"></div>`;
  } else if(k==='team'){
    h=`<div class="sl">${esc(t('tm_h'))}</div><div class="rsums" id="tm-sum"></div><div id="tm-list" class="tlist"></div><div class="note">${esc(t('tm_priv'))}</div>`;
  } else if(k==='msg'){
    const m=ORG.msg;
    h=`<div class="box tf"><div class="sl">${esc(t('m_h'))}</div>
      <div class="lbl2">${esc(t('m_to'))}</div><div class="seg">${['all','zone','staff'].map(x=>`<button class="${m.to===x?'on':''}" data-act="m-to" data-v="${x}">${esc(t('m_'+x))}</button>`).join('')}</div>
      ${m.to==='zone'?`<select class="sel" id="m-zone" style="margin-top:8px">${POIS.map(z=>`<option value="${z.id}"${z.id===m.zone?' selected':''}>${z.icon} ${esc(zName(z.id))}</option>`).join('')}</select>`:''}
      <div class="lbl2">${esc(t('m_tpl'))}</div><div class="tpls">${['m_t1','m_t2','m_t3','m_t4'].map(x=>`<button class="tpl" data-act="m-tpl" data-v="${x}">${esc(t(x,{z:zName(m.zone)}))}</button>`).join('')}</div>
      <textarea class="txt ta" id="m-text" maxlength="140" placeholder="${esc(t('m_ph'))}">${esc(m.text||'')}</textarea>
      <button class="btn btn-p wide" data-act="m-send">${esc(t('m_send'))}</button><div class="hint" style="margin-top:8px">${esc(t('m_note'))}</div></div>
      <div class="sl">${esc(t('m_hist'))}</div><div id="m-hist" class="tlist"></div>`;
  }
  p.innerHTML=h; p.scrollTop=0; orgRefresh();
}
function orgAct(a,b){
  const f=ORG.form,byId=id=>ORG.tasks.find(x=>x.id===id);
  if(a==='o-sec'){const k=newTask('crowd',b.dataset.z,'urgent');assign(k);}
  else if(a==='o-notify'){ORG.msg={to:'zone',zone:b.dataset.z,text:t('m_t2',{z:zName(b.dataset.z)})};setTab('msg');}
  else if(a==='o-assign'){const k=byId(b.dataset.id);if(k)assign(k);}
  else if(a==='o-cancel'){const k=byId(b.dataset.id);if(k)cancelTask(k);}
  else if(a==='o-task'){const k=byId(b.dataset.id);if(!k)return;ORG.hl='tk_'+k.id;const z=POI_BY[k.zone];flyTo(z.x,z.y,Math.max(V.s,1.2));orgDraw();if(isMobile())$('#side').classList.add('collapsed');}
  else if(a==='o-staff'){const w=ORG.staff.find(x=>x.st.id===b.dataset.id);if(!w)return;ORG.hl='st_'+w.st.id;flyTo(w.x,w.y,Math.max(V.s,1.3));orgDraw();if(isMobile())$('#side').classList.add('collapsed');}
  else if(a==='f-type'){f.type=b.dataset.v;orgPanel('tasks');}
  else if(a==='f-prio'){f.prio=b.dataset.v;orgPanel('tasks');}
  else if(a==='f-pick'){ORG.pick=!ORG.pick;vp.classList.toggle('pick',ORG.pick);if(ORG.pick){toast(t('t_pick_tap'),'','',2600);if(isMobile())$('#side').classList.add('collapsed');}orgPanel('tasks');}
  else if(a==='f-go'||a==='f-go0'){f.zone=$('#f-zone').value;const k=newTask(f.type,f.zone,f.prio);if(a==='f-go'){if(!assign(k))orgDraw();}else{toast(t('t_created'),t('tt_'+k.type)+' · '+zName(k.zone),'',2400);orgDraw();}}
  else if(a==='m-to'){ORG.msg.text=$('#m-text').value;ORG.msg.to=b.dataset.v;orgPanel('msg');}
  else if(a==='m-tpl'){$('#m-text').value=t(b.dataset.v,{z:zName(ORG.msg.zone)});}
  else if(a==='m-send'){
    const tx=$('#m-text').value.trim(); if(!tx){toast(t('m_empty'),'','a');return;} const m=ORG.msg;
    const n=m.to==='all'?demo.crowd.length:m.to==='staff'?ORG.staff.length:Math.max(K_MIN,(ORG.zones.find(z=>z.id===m.zone)||{n:0}).n);
    ORG.msgs.unshift({text:tx,to:m.to==='zone'?zName(m.zone):t('m_'+m.to),n,at:fmtHour(demo.hour)}); m.text='';
    toast(t('m_sent'),t('m_reach',{n}),'g',2600); orgPanel('msg');
  }
  else if(a==='lay'){const l=b.dataset.v;ORG.layers[l]=!ORG.layers[l];$('#heat').classList.toggle('on',ORG.layers.heat);orgLegend();orgDraw();}
}
function orgLegend(){
  const lg=$('#legend'); lg.classList.remove('hide');
  lg.innerHTML=`<div class="lays">${['heat','staff','tasks'].map(l=>`<button class="lay${ORG.layers[l]?' on':''}" data-act="lay" data-v="${l}">${esc(t('lay_'+l))}</button>`).join('')}</div>`
   +(ORG.layers.heat?`<b>${esc(t('leg_heat'))}</b><div class="bar"></div><div class="row"><span>${esc(t('leg_lo'))}</span><span>≥${K_MIN}</span><span>${esc(t('leg_hi'))}</span></div>`:'');
}
$('#legend').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&orgMode())orgAct(b.dataset.act,b);});
function orgMapTap(w){
  if(!ORG.pick) return; ORG.pick=false; vp.classList.remove('pick');
  let b=POIS[0],bd=1e9; for(const p of POIS){const d=(p.x-w.x)**2+(p.y-w.y)**2;if(d<bd){bd=d;b=p;}}
  ORG.form.zone=b.id; ripple(b.x,b.y); toast(t('t_zone_set',{z:zName(b.id)}),'','g',1800); setTab('tasks');
}
function orgMarkerTap(id){
  if(id.startsWith('st_')){ORG.hl=id;setTab('team');orgDraw();}
  else if(id.startsWith('tk_')){ORG.hl=id;setTab('tasks');orgDraw();}
}

boot();
</script>
</body>
